[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hhg"
version = "0.1.0"
description = "High-harmonic generation spectra from time-dependent current traces (TDDFT output)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mukhtar Lawan" }]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.10.9",
]

[project.scripts]
hhg-figures = "hhg.figures:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "NPY"]
